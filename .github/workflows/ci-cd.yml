name: Build and Publish

on:
  push:
    branches: [main, master]

permissions: {}

env:
  PLUGIN_NAME: intelligence-assistant
  MAIN_FILE: main.js
  STYLE_FILE: styles.css
  MANIFEST_FILE: manifest.json

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_exists: ${{ steps.version.outputs.tag_exists }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-tags: true

    - name: Read version and check tag
      id: version
      run: |
        VERSION=$(node -p "require('./manifest.json').version")
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        if git ls-remote --tags origin "refs/tags/$VERSION" | grep -q .; then
          echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          echo "Tag $VERSION already exists — skipping release."
        else
          echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          echo "Tag $VERSION not found — will build and release."
          node scripts/release-notes.js "$RUNNER_TEMP/release-notes-preview.md"
        fi

  build:
    needs: check
    if: needs.check.outputs.tag_exists == 'false'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'
    - run: npm ci
    - name: Check and build once
      run: |
        npm run lint
        npm run typecheck
        npm run build:production
        shasum -a 256 main.js styles.css manifest.json > artifact-sha256.txt
    - uses: actions/upload-artifact@v4
      with:
        name: verified-plugin-${{ github.sha }}
        path: |
          main.js
          styles.css
          manifest.json
          artifact-sha256.txt
          artifact-provenance.json

  release:
    needs: [check, build]
    if: needs.check.outputs.tag_exists == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'

    - uses: actions/download-artifact@v4
      with:
        name: verified-plugin-${{ github.sha }}
        path: .

    - name: Verify release artifact digest
      run: shasum -a 256 -c artifact-sha256.txt

    - name: Verify plugin files exist
      run: |
        if [ ! -f ${{ env.MAIN_FILE }} ]; then
          echo "Plugin main file not found!"
          ls -la
          exit 1
        fi

        if [ ! -f ${{ env.STYLE_FILE }} ]; then
          echo "Plugin style file not found!"
          exit 1
        fi

        if [ ! -f ${{ env.MANIFEST_FILE }} ]; then
          echo "Plugin manifest file not found!"
          exit 1
        fi

    - name: Create release directory
      run: |
        mkdir -p release
        cp ${{ env.MAIN_FILE }} ${{ env.STYLE_FILE }} ${{ env.MANIFEST_FILE }} release/

    - name: Package plugin as .zip
      working-directory: ./release
      run: zip -r ../${{ env.PLUGIN_NAME }}.zip ./*

    - name: Upload packaged plugin as artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.PLUGIN_NAME }}-zip
        path: ${{ env.PLUGIN_NAME }}.zip

    - name: Upload plugin files artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.PLUGIN_NAME }}-files
        path: |
          release/${{ env.MAIN_FILE }}
          release/${{ env.STYLE_FILE }}
          release/${{ env.MANIFEST_FILE }}

    - name: Attest main.js
      uses: actions/attest-build-provenance@v2
      with:
        subject-path: release/${{ env.MAIN_FILE }}

    - name: Attest styles.css
      uses: actions/attest-build-provenance@v2
      with:
        subject-path: release/${{ env.STYLE_FILE }}

    - name: Attest manifest.json
      uses: actions/attest-build-provenance@v2
      with:
        subject-path: release/${{ env.MANIFEST_FILE }}

    - name: Prepare release notes from version changelog
      env:
        RELEASE_VERSION: ${{ needs.check.outputs.version }}
      run: node scripts/release-notes.js "$RUNNER_TEMP/release-notes.md"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ needs.check.outputs.version }}
        target_commitish: ${{ github.sha }}
        name: Intelligence Assistant ${{ needs.check.outputs.version }}
        body_path: ${{ runner.temp }}/release-notes.md
        files: |
          release/${{ env.MAIN_FILE }}
          release/${{ env.STYLE_FILE }}
          release/${{ env.MANIFEST_FILE }}
